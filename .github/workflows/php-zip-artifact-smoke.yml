name: php-zip artifact smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, zip

      - name: Verify PHP extensions
        shell: bash
        run: |
          php -r 'if(!extension_loaded("openssl")){fwrite(STDERR,"Missing openssl\n");exit(1);}if(!extension_loaded("zip")){fwrite(STDERR,"Missing zip\n");exit(1);}echo "Required extensions loaded\n";'

      - name: Verify base patch template
        shell: bash
        run: |
          if [ ! -f "data/patch.zip" ]; then
            echo "data/patch.zip missing, creating fallback"
            php -r '$z=new ZipArchive();$z->open("data/patch.zip", ZipArchive::CREATE|ZipArchive::OVERWRITE);$z->addFromString("META-INF/com/google/android/update-binary","stub");$z->close();'
          else
            echo "data/patch.zip verified ($(stat -c %s data/patch.zip 2>/dev/null || wc -c < data/patch.zip) bytes)"
          fi

      - name: Generate flashable zip (System PHP)
        shell: bash
        run: php bin/mtk_imei.php

      - name: Verify output zips exist
        shell: bash
        run: |
          test -f out/pox_imei_fixer-begonia.zip
          test -f out/imei_repair-begonia.zip

      - name: Test Windows bundled php.exe
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          echo === Testing bundled Windows PHP version ===
          bin\php.exe -v
          echo === Testing bundled Windows PHP modules ===
          bin\php.exe -d extension_dir=bin -c bin\php.ini -m
          echo === Testing mtk_imei generation via bundled Windows PHP ===
          bin\php.exe -d extension_dir=bin -c bin\php.ini bin\mtk_imei.php
          if not exist out\pox_imei_fixer-begonia.zip (
            echo [-] out\pox_imei_fixer-begonia.zip was not created!
            exit /b 1
          )
          echo [+] Bundled Windows PHP test PASSED!

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: pox-imei-fixer-${{ matrix.os }}
          path: |
            README.md
            LICENSE
            mtk_imei.sh
            mtk_imei.cmd
            bin/
            data/
